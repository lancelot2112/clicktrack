<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ClickTrack</title>
<meta name="theme-color" content="#E9EDF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClickTrack">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EDF0; --ink:#14202B; --ink-soft:#5B6B78; --panel:#FFFFFF;
    --line:#CDD6DD; --press:#DCE3E8;
    --c1:#E4572E; --c2:#2F9E44; --c3:#2458C5; --c4:#8E44AD; --c5:#D9A404; --c6:#0E7C86;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    font-variation-settings:'wdth' 88;
    overscroll-behavior:none;
  }
  #app{max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}

  /* ---------- shared ---------- */
  button{font:inherit; border:none; cursor:pointer; color:inherit; background:none;}
  .tapbtn{transition:transform .06s ease;}
  .tapbtn:active{transform:scale(.96);}
  input[type=text],input[type=number]{
    font:inherit; font-weight:600; color:var(--ink);
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:12px 14px; width:100%;
  }
  input:focus{outline:none; border-color:var(--ink);}

  /* ---------- home ---------- */
  header.home{padding:22px 18px 6px;}
  .h-row{display:flex; align-items:center; justify-content:space-between;}
  header.home h1{
    margin:0; font-size:28px; font-weight:900; letter-spacing:-.02em;
    font-variation-settings:'wdth' 78;
  }
  header.home p{margin:4px 0 0; color:var(--ink-soft); font-size:13px;}
  .newbtn2{
    background:var(--ink); color:#fff; font-weight:700; font-size:14px;
    padding:10px 16px; border-radius:999px;
  }
  .h-btns{display:flex; gap:8px;}
  .editbtn{
    background:none; border:2px solid var(--line); color:var(--ink-soft);
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px;
  }
  .editbtn.on{background:var(--c1); border-color:var(--c1); color:#fff;}
  /* edit mode: tiles get a dashed ring and a gentle pulse */
  .board.editing .tile{outline:2px dashed rgba(255,255,255,.8); outline-offset:-5px; animation:editpulse 1.2s ease-in-out infinite;}
  @keyframes editpulse{50%{transform:scale(.97);}}
  .board{flex:1; padding:4px 14px 20px;}
  .group-h{margin:18px 4px 8px; font-size:14px; font-weight:800; color:var(--ink-soft);}
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:7px;}
  .tile{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:0; text-align:left;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-y;
    color:#fff; border-radius:14px; padding:8px 9px 7px; min-height:68px;
    background:var(--tile-c,#888);
    background:
      radial-gradient(130% 90% at 18% 0%, rgba(255,255,255,.30), rgba(255,255,255,0) 55%),
      linear-gradient(160deg,
        color-mix(in srgb, var(--tile-c) 86%, #fff) 0%,
        var(--tile-c) 55%,
        color-mix(in srgb, var(--tile-c) 80%, #000) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.18),
      0 3px 8px color-mix(in srgb, var(--tile-c) 35%, transparent);
  }
  .tile:active{
    box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.15);
  }
  .tile .t-name{
    font-size:10.5px; font-weight:700; width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; opacity:.95;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .tile .t-count{
    font-size:22px; font-weight:900; font-variant-numeric:tabular-nums;
    margin-top:auto; line-height:1; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.22);
    font-variation-settings:'wdth' 80;
  }
  .tile .t-sub{font-size:8px; font-weight:600; color:rgba(255,255,255,.78); letter-spacing:.02em;}
  .tile .t-tap,.tile .t-minus{
    position:absolute; bottom:5px;
    font-size:9px; font-weight:800; color:rgba(255,255,255,.9);
    background:rgba(0,0,0,.20); padding:2px 6px; border-radius:999px;
  }
  .tile .t-tap{right:6px;}
  .tile .t-minus{left:6px;}
  /* split tile: left third subtracts, right two-thirds add */
  .tile.split{min-height:78px;}
  .tile.split::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:36%;
    background:rgba(0,0,0,.13); border-radius:14px 0 0 14px; pointer-events:none;
  }
  .tile>span{position:relative;}
  .tile.split .t-count{margin-bottom:15px;}
  .empty{
    margin:40px 24px; text-align:center; color:var(--ink-soft); font-size:15px; line-height:1.5;
  }
  .undo{display:block; margin:6px auto 0; color:var(--ink-soft); font-size:13px; padding:8px 14px; text-decoration:underline;}
  /* drag-to-pick-amount readout */
  .scrub{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:20; pointer-events:none; width:calc(100% - 28px); max-width:492px;
    background:var(--panel); border-radius:16px; padding:12px 18px 14px; text-align:center;
    box-shadow:0 8px 24px rgba(20,32,43,.28);
  }
  .scrub-track{height:8px; background:var(--press); border-radius:4px; margin-top:10px; display:flex;}
  .scrub-fill{height:100%; border-radius:4px; min-width:0;}
  .scrub-fill.neg{margin-left:auto;}
  .scrub-val{
    font-size:46px; font-weight:900; line-height:1; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; font-variation-settings:'wdth' 78;
  }
  .scrub-sub{margin-top:6px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bump{animation:bump .18s ease;}
  @keyframes bump{40%{transform:scale(1.06);}}

  /* ---------- counter page ---------- */
  .d-top{display:flex; align-items:center; padding:14px 10px 0; gap:6px;}
  .d-top .back{padding:10px 12px; font-weight:700; font-size:15px; color:var(--ink-soft);}
  .d-top .d-title{flex:1; text-align:center; font-weight:800; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .statrow{
    display:flex; justify-content:space-around; gap:8px; padding:14px 16px 6px;
    border-bottom:2px solid var(--line); margin:0 20px 4px;
  }
  .stat{text-align:center; min-width:0;}
  .stat b{display:block; font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--acc); font-variation-settings:'wdth' 80;}
  .stat span{font-size:11px; color:var(--ink-soft); font-weight:600;}

  /* ---------- timer bar ---------- */
  .timerbar{
    margin-top:auto; background:var(--panel); border-top:2px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .timerbar .t-row{display:flex; align-items:center; gap:10px;}
  .timerbar .t-time{
    font-size:34px; font-weight:900; font-variant-numeric:tabular-nums; min-width:110px;
  }
  .timerbar .t-time.done{color:var(--c1);}
  .t-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .t-chips button{
    background:var(--press); font-weight:700; font-size:13px;
    padding:9px 14px; border-radius:999px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  }
  .t-chips button.reset{background:none; border:2px solid var(--line); color:var(--ink-soft);}
  .t-main{
    margin-left:auto; background:var(--acc); color:#fff; font-weight:800;
    font-size:15px; padding:12px 20px; border-radius:12px; min-width:88px;
  }
  .t-main.running{background:var(--ink);}
  .t-track{height:6px; background:var(--press); border-radius:3px; margin-top:10px; overflow:hidden;}
  .t-fill{height:100%; background:var(--acc); width:0%; border-radius:3px;}

  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; background:var(--panel); border:2px solid var(--line);
    border-radius:10px; padding:11px 4px; font-weight:700; font-size:14px;
  }
  .seg button.sel{border-color:var(--ink); background:var(--press);}

  /* ---------- warn ---------- */
  .warnbar{
    margin:8px 14px 0; padding:10px 14px; border-radius:10px;
    background:#FBE9E2; color:#8C3A21; font-size:13px; font-weight:600; line-height:1.4;
  }

  /* ---------- form ---------- */
  .form{padding:10px 20px 40px; display:flex; flex-direction:column; gap:16px;}
  .form label,.sheet label{font-size:13px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .form .row{display:flex; gap:10px;}
  .form .row>div{flex:1; min-width:0;}
  .swatches{display:flex; gap:10px;}
  .swatch{width:40px; height:40px; border-radius:50%; border:3px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .form .save{
    background:var(--ink); color:#fff; font-weight:800; font-size:16px;
    padding:16px; border-radius:12px;
  }
  .form .danger{color:var(--c1); font-weight:700; padding:12px; font-size:14px;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  /* ---------- sheet (hold a timer button) ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:10; background:rgba(20,32,43,.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--panel); width:100%; max-width:520px;
    border-radius:18px 18px 0 0; display:flex; flex-direction:column; gap:14px;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h3{margin:0; font-size:17px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet input{font-size:18px;}
  .sheet .row{display:flex; gap:10px; align-items:center;}
  .sheet .done{
    flex:1; background:var(--ink); color:#fff; font-weight:800; font-size:16px;
    padding:14px; border-radius:12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const COLORS = ['#E4572E','#2F9E44','#2458C5','#8E44AD','#D9A404','#0E7C86'];
const KEY = 'clicktrack-v1';
let state = { accs: [] };
let view = { name:'home' };
let timers = {};    // timer runtime: {left,total,running,int}
let lastAdd = null; // {accId, amount, dayKey}
let editMode = false;   // header Edit → tap a tile to open its page

/* ---------- storage ---------- */
// Uses Claude artifact storage when available; falls back to the browser's
// localStorage when published as a normal web page (e.g. GitHub Pages).
const store = (window.storage && window.storage.get) ? window.storage : {
  async get(k){
    const v = localStorage.getItem(k);
    if(v === null) throw new Error('missing key');
    return {key:k, value:v};
  },
  async set(k,v){ localStorage.setItem(k, v); return {key:k, value:v}; }
};
let storageOK = null;   // null = unknown, true = working, false = unavailable
let saveTimer = null;

async function load(){
  try{
    const r = await store.get(KEY);
    storageOK = true;
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){
    // get() throws on a missing key too, so probe with a write before giving up
    try{
      await store.set(KEY+'-probe','1');
      storageOK = true;
    }catch(e2){
      storageOK = false;
    }
  }
  migrate();
  render();
}

// bring older saved counters up to the current shape
function migrate(){
  (state.accs || []).forEach(a=>{
    if(!a.kind) a.kind = 'tally';
    if(!isFinite(a.tap) || a.tap===0) a.tap = 1;
    if(a.split === false) a.sub = 0;
    else if(!(isFinite(a.sub) && a.sub > 0)) a.sub = Math.abs(a.tap);
    if(a.show === 'lifetime') a.show = 'all';
    if(!a.show) a.show = 'today';
    if(!a.byDay) a.byDay = {};
    delete a.split; delete a.presets; delete a.timers;
  });
}

// debounce rapid taps into one write
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 300);
}

async function doSave(){
  if(storageOK === false) return; // in-memory mode
  const payload = JSON.stringify(state);
  for(let i=0; i<3; i++){
    try{
      await store.set(KEY, payload);
      if(storageOK !== true){ storageOK = true; render(); }
      return;
    }catch(e){
      await new Promise(r=>setTimeout(r, 400*(i+1)));
    }
  }
  if(storageOK !== false){ storageOK = false; render(); }
}

function warnbar(){
  return storageOK === false
    ? `<div class="warnbar">Saving is unavailable right now — counts will reset when you close this. Your taps still work.</div>`
    : '';
}

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
function dayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n){
  if(!isFinite(n)) return '0';
  return (Math.round(n*100)/100).toLocaleString();
}
function findAcc(id){ return state.accs.find(a=>a.id===id); }
function prune(acc){
  const keys = Object.keys(acc.byDay).sort();
  while(keys.length > 400) delete acc.byDay[keys.shift()];
}
// first day (Monday) of the current week, as a day key
function weekStartKey(){
  const d = new Date();
  const back = (d.getDay() + 6) % 7;   // Mon=0 … Sun=6
  d.setDate(d.getDate() - back);
  return dayKey(d);
}
function sumSince(acc, fromKey){
  return Object.entries(acc.byDay).reduce((s,[k,v])=> k >= fromKey ? s+v : s, 0);
}
const PERIODS = [['today','Today'],['week','Week'],['month','Month'],['all','All time']];
function periodValue(acc, p){
  if(p==='week') return sumSince(acc, weekStartKey());
  if(p==='month') return sumSince(acc, dayKey().slice(0,7)+'-01');
  if(p==='all') return acc.lifetime || 0;
  return acc.byDay[dayKey()] || 0;
}
function tileValue(a){ return periodValue(a, a.show); }

/* ---------- beep ---------- */
let actx = null;
function beep(){
  if(!actx) return;
  [0,.35,.7].forEach(t=>{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='square'; o.frequency.value=880;
    g.gain.setValueAtTime(.001, actx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.3, actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.3);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.32);
  });
}

/* ---------- actions ---------- */
function addAmount(id, amt){
  const acc = findAcc(id);
  if(!acc || !isFinite(amt) || amt===0) return;
  const k = dayKey();
  acc.byDay[k] = (acc.byDay[k]||0) + amt;
  acc.lifetime = (acc.lifetime||0) + amt;
  prune(acc);
  lastAdd = {accId:id, amount:amt, dayKey:k};
  save(); render();
  const el = $('#tile-'+id+' .t-count');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function undo(){
  if(!lastAdd) return;
  const acc = findAcc(lastAdd.accId);
  if(acc){
    acc.byDay[lastAdd.dayKey] = (acc.byDay[lastAdd.dayKey]||0) - lastAdd.amount;
    acc.lifetime -= lastAdd.amount;
  }
  lastAdd = null; save(); render();
}
function signed(v){ return (v < 0 ? '−' : '+') + fmt(Math.abs(v)); }

/* ---------- timer ---------- */
function homeTimers(){ return state.homeTimers || [30,60,90]; }
function tstate(id, def){
  if(!timers[id]) timers[id] = {left:def||60, total:def||60, running:false, int:null};
  return timers[id];
}
function toggleTimer(id){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  const t = tstate(id);
  if(t.running){
    clearInterval(t.int); t.running=false;
  }else{
    if(t.left<=0) t.left = t.total;
    t.running = true;
    t.int = setInterval(()=>{
      t.left--;
      if(t.left<=0){
        clearInterval(t.int); t.running=false; t.left=0; beep();
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
      updateTimerUI(id);
    },1000);
  }
  updateTimerUI(id);
}
function setTimerTo(id, s){
  const t = tstate(id);
  clearInterval(t.int); t.running = false;
  t.left = t.total = s;
  updateTimerUI(id);
}
function resetTimer(id){
  const t = tstate(id);
  clearInterval(t.int); t.running = false;
  t.left = t.total;
  updateTimerUI(id);
}
function fmtTime(s){
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function updateTimerUI(id){
  const t = tstate(id);
  const time = $('.t-time'), main = $('.t-main'), fill = $('.t-fill');
  if(!time) return;
  time.textContent = fmtTime(t.left);
  time.classList.toggle('done', t.left===0 && !t.running);
  main.textContent = t.running ? 'Pause' : (t.left===0 ? 'Restart' : 'Start');
  main.classList.toggle('running', t.running);
  fill.style.width = t.total ? (100*(t.total-t.left)/t.total)+'%' : '0%';
}

function timerBarHTML(id, presets){
  return `
    <div class="timerbar">
      <div class="t-row">
        <div class="t-time">${fmtTime(presets[0])}</div>
        <button class="t-main tapbtn" onclick="toggleTimer('${id}')">Start</button>
      </div>
      <div class="t-chips">
        ${presets.map((s,i)=>`<button class="tapbtn"
          onpointerdown="chipDown(event,'${id}',${i})"
          onpointermove="pressMove(event)"
          onpointerup="chipUp(event,'${id}',${i})"
          onpointercancel="cancelPress()"
          oncontextmenu="return false">${fmtTime(s)}</button>`).join('')}
        <button class="reset tapbtn" onclick="resetTimer('${id}')">Reset</button>
      </div>
      <div class="t-track"><div class="t-fill"></div></div>
    </div>`;
}

/* ---------- views ---------- */
function render(){
  const app = $('#app');
  if(view.name==='home') app.innerHTML = homeView();
  else if(view.name==='counter') app.innerHTML = counterView(view.id);
  if(view.name==='home'){
    tstate('_home', homeTimers()[0]);
    updateTimerUI('_home');
  }
}

function homeView(){
  const groups = {};
  state.accs.forEach(a=>{
    const g = (a.group||'').trim() || 'Other';
    (groups[g] = groups[g] || []).push(a);
  });
  const names = Object.keys(groups).sort((x,y)=>
    (x==='Other')-(y==='Other') || x.localeCompare(y));
  const sections = names.map(g=>`
    ${(names.length>1 || g!=='Other') ? `<div class="group-h">${esc(g)}</div>` : ''}
    <div class="tiles">${groups[g].map(tileHTML).join('')}</div>`).join('');
  const last = lastAdd && findAcc(lastAdd.accId);
  return `
    <header class="home">
      <div class="h-row">
        <h1>ClickTrack</h1>
        <div class="h-btns">
          ${state.accs.length ? `<button class="editbtn tapbtn ${editMode?'on':''}" onclick="toggleEdit()">${editMode?'Cancel':'Edit'}</button>` : ''}
          <button class="newbtn2 tapbtn" onclick="go('counter',null)">+ New</button>
        </div>
      </div>
      <p>${editMode ? 'Tap a tile to edit it.' : 'Tap to count · drag to pick an amount · hold a timer button to change it'}</p>
    </header>
    ${warnbar()}
    <div class="board ${editMode?'editing':''}">
      ${state.accs.length ? sections : `<div class="empty">Nothing here yet.<br>Make a counter for push-ups, bets, jinxes — anything you tally.</div>`}
      ${last && !editMode ? `<button class="undo tapbtn" onclick="undo()">Undo ${signed(lastAdd.amount)} on ${esc(last.name)}</button>` : ''}
    </div>
    ${timerBarHTML('_home', homeTimers())}`;
}
function isSplit(a){ return isFinite(a.sub) && a.sub > 0; }
function addAmt(a){ return Math.abs(isFinite(a.tap) ? a.tap : 1); }
function subAmt(a){ return a.sub; }
function tileHTML(a){
  const tap = isFinite(a.tap) ? a.tap : 1;
  const split = isSplit(a);
  const badge = (split || tap>0 ? '+' : '−') + fmt(Math.abs(tap));
  return `
    <button class="tile tapbtn ${split?'split':''}" id="tile-${a.id}" style="--tile-c:${a.color}"
      onpointerdown="tileDown(event,'${a.id}')"
      onpointermove="tileMove(event,'${a.id}')"
      onpointerup="tileUp(event,'${a.id}')"
      onpointercancel="tileCancel()"
      oncontextmenu="return false">
      <span class="t-name">${esc(a.name)}</span>
      <span class="t-count">${fmt(tileValue(a))}</span>
      ${split ? `<span class="t-minus">−${fmt(subAmt(a))}</span>` : ''}
      <span class="t-tap">${badge}</span>
    </button>`;
}

/* generic tap-vs-hold: short press = onTap, ~450ms hold = onLong */
const SPLIT_AT = 0.36;   // fraction of tile width that is the "−" zone
let pressInfo = null;
function pressDown(ev, key, onLong){
  cancelPress();
  pressInfo = {key, x:ev.clientX, y:ev.clientY, long:false, t:null};
  if(onLong) pressInfo.t = setTimeout(()=>{
    if(pressInfo && pressInfo.key===key){
      pressInfo.long = true;
      if(navigator.vibrate) navigator.vibrate(15);
      onLong();
    }
  }, 450);
}
function pressMove(ev){
  if(pressInfo && (Math.abs(ev.clientX-pressInfo.x)>12 || Math.abs(ev.clientY-pressInfo.y)>12)) cancelPress();
}
// returns true when the release completes a short tap
function pressUp(key){
  if(!pressInfo || pressInfo.key!==key){ cancelPress(); return false; }
  const wasLong = pressInfo.long;
  cancelPress();
  return !wasLong;
}
function cancelPress(){
  if(pressInfo) clearTimeout(pressInfo.t);
  pressInfo = null;
}

/* tiles: tap = count (left third subtracts on split tiles),
   drag sideways = scrub an arbitrary amount and apply it once on release,
   in edit mode a tap opens the counter page */
function tileSide(ev, a){   // -1 = left (subtract) zone, +1 = right (add) zone
  if(!isSplit(a)) return 1;
  const r = ev.currentTarget.getBoundingClientRect();
  return (ev.clientX - r.left) < r.width*SPLIT_AT ? -1 : 1;
}
function tileTapAmount(a, side){
  if(!isSplit(a)) return isFinite(a.tap) ? a.tap : 1;
  return side < 0 ? -subAmt(a) : addAmt(a);
}
function toggleEdit(){ editMode = !editMode; render(); }
function tileDown(ev, id){
  const a = findAcc(id);
  if(!a) return;
  try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}
  pressDown(ev, 'tile-'+id, null);
  pressInfo.side = tileSide(ev, a);
  pressInfo.edit = editMode;
}
function tileMove(ev, id){
  if(scrub){ scrubUpdate(ev.clientX); return; }
  if(!pressInfo || pressInfo.key!=='tile-'+id || pressInfo.edit) return;
  const dx = ev.clientX - pressInfo.x, dy = ev.clientY - pressInfo.y;
  if(Math.abs(dx) > 12 && Math.abs(dx) >= Math.abs(dy)) scrubBegin(id, pressInfo.side, ev.clientX);
  else if(Math.abs(dy) > 12) cancelPress();   // vertical = scrolling
}
function tileUp(ev, id){
  if(scrub){ scrubEnd(true); return; }
  const edit = pressInfo && pressInfo.edit;
  if(!pressUp('tile-'+id)) return;
  const a = findAcc(id);
  if(!a) return;
  if(edit){ go('counter', id); return; }
  addAmount(id, tileTapAmount(a, tileSide(ev, a)));
}
function tileCancel(){ scrubEnd(false); cancelPress(); }

/* ---------- scrub: the screen is a slider ----------
   Adding (started on the right zone): 0 at the left edge, full range at the right edge.
   Subtracting (started on the left zone): 0 at the right edge, full range at the left edge.
   Full range is SCRUB_STEPS steps, so 50 for whole-number amounts, 5 for tenths. */
const SCRUB_STEPS = 50;
const SCRUB_INSET = 32;   // px from each screen edge where the slider pins at 0 / full range
let scrub = null;      // {id, sign, step, range, left, width, v, base, a}
// step size for scrubbing: whole numbers step by 1 (5 / 50 for big amounts),
// decimals step by their own precision
function scrubStep(amt){
  const n = Math.abs(amt);
  if(Number.isInteger(n)) return n >= 500 ? 50 : n >= 50 ? 5 : 1;
  const d = Math.min(2, (String(n).split('.')[1] || '').length);
  return Math.pow(10, -d);
}
function scrubBegin(id, side, x){
  const a = findAcc(id);
  if(!a) return;
  cancelPress();
  const start = tileTapAmount(a, side);
  const step = scrubStep(start);
  const r = $('#app').getBoundingClientRect();
  scrub = {id, sign:(start < 0 ? -1 : 1), step, range:step*SCRUB_STEPS,
           left:r.left + SCRUB_INSET, width:r.width - 2*SCRUB_INSET, v:0, base:tileValue(a), a};
  const d = document.createElement('div');
  d.className = 'scrub'; d.id = 'scrub';
  document.body.appendChild(d);
  if(navigator.vibrate) navigator.vibrate(8);
  scrubUpdate(x);
}
function scrubUpdate(x){
  if(!scrub) return;
  const s = scrub;
  const raw = s.sign > 0 ? (x - s.left) / s.width : (s.left + s.width - x) / s.width;
  const f = Math.min(1, Math.max(0, raw));
  const mag = Math.round(f * s.range / s.step) * s.step;
  s.v = Math.round(s.sign * mag * 100) / 100;
  const v = s.v, a = s.a;
  const sign = v > 0 ? '+' : v < 0 ? '−' : '';
  const el = $('#scrub');
  if(el) el.innerHTML = `
    <div class="scrub-val" style="color:${a.color}">${sign}${fmt(Math.abs(v))}</div>
    <div class="scrub-sub">${esc(a.name)} · ${fmt(s.base)} → ${fmt(s.base + v)} · release to apply</div>
    <div class="scrub-track"><div class="scrub-fill ${s.sign < 0 ? 'neg' : ''}" style="width:${(Math.abs(v)/s.range*100).toFixed(1)}%; background:${a.color}"></div></div>`;
}
function scrubEnd(apply){
  if(!scrub) return;
  const s = scrub;
  scrub = null;
  const el = $('#scrub');
  if(el) el.remove();
  if(apply) addAmount(s.id, s.v);
}

/* timer buttons: tap = set timer, hold = edit that button */
function chipDown(ev, id, i){ pressDown(ev, 'chip-'+id+'-'+i, ()=>openTimerSheet(id, i)); }
function chipUp(ev, id, i){
  if(!pressUp('chip-'+id+'-'+i)) return;
  const p = homeTimers();
  if(i in p) setTimerTo(id, p[i]);
}

/* ---------- sheet ---------- */
function openSheet(html){
  closeSheet();
  const d = document.createElement('div');
  d.className = 'backdrop'; d.id = 'sheet';
  d.innerHTML = `<div class="sheet">${html}</div>`;
  const opened = Date.now();
  // ignore the click that trails the long press itself
  d.addEventListener('click', e=>{ if(e.target===d && Date.now()-opened>400) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet(){ const d = $('#sheet'); if(d) d.remove(); }

function openTimerSheet(id, i){
  const p = homeTimers();
  if(!(i in p)) return;
  openSheet(`
    <h3>Timer button</h3>
    <div><label>Time (m:ss or seconds)</label>
      <input type="text" id="sTime" value="${fmtTime(p[i])}" inputmode="numeric"
        onkeydown="if(event.key==='Enter')saveTimerSheet('${id}',${i})"></div>
    <div class="row"><button class="done tapbtn" onclick="saveTimerSheet('${id}',${i})">Done</button></div>`);
}
function saveTimerSheet(id, i){
  const s = parseTimeStr($('#sTime').value);
  if(!isFinite(s) || s<=0){ $('#sTime').focus(); return; }
  const p = homeTimers().slice(); p[i] = s; state.homeTimers = p;
  closeSheet(); save(); render();
  if(!tstate(id).running) setTimerTo(id, s);
}

/* ---------- counter page: stats + settings ---------- */
function counterView(id){
  const a = id ? findAcc(id) : null;
  if(id && !a){ view={name:'home'}; return homeView(); }
  const show = a ? a.show : 'today';
  const sel = a ? a.color : COLORS[state.accs.length % COLORS.length];
  const sw = COLORS.map(c=>`
    <button class="swatch ${c===sel?'sel':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('');
  const stats = a ? `
    <div class="statrow" style="--acc:${a.color}">
      ${PERIODS.map(([p,l])=>`<div class="stat"><b>${fmt(periodValue(a,p))}</b><span>${l}</span></div>`).join('')}
    </div>` : '';
  return `
  <div class="d-top">
    <button class="back" onclick="go('home')">‹ ${a?'Back':'Cancel'}</button>
    <div class="d-title">${a?esc(a.name):'New counter'}</div>
    <span style="width:64px"></span>
  </div>
  ${stats}
  <div class="form">
    <div><label>Name</label>
      <input type="text" id="fName" value="${a?esc(a.name):''}" placeholder="Push-ups, Miles, Bets won…"></div>
    <div class="row">
      <div><label>Group</label>
        <input type="text" id="fGroup" list="groupList" value="${a?esc(a.group||''):''}" placeholder="Workout">
        <datalist id="groupList">
          ${[...new Set(state.accs.map(x=>(x.group||'').trim()).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}
        </datalist></div>
      <div><label>Unit</label>
        <input type="text" id="fUnit" value="${a?esc(a.unit||''):''}" placeholder="reps, mi, $"></div>
    </div>
    <div>
      <div class="row">
        <div><label>Tap adds</label>
          <input type="number" step="any" id="fTap" value="${a?a.tap:1}" inputmode="decimal"></div>
        <div><label>Left side subtracts</label>
          <input type="number" step="any" min="0" id="fSub" value="${a?(isSplit(a)?a.sub:''):1}" inputmode="decimal" placeholder="off"></div>
      </div>
      <div class="hint">Right side of the tile adds, left third subtracts. Leave subtract blank for a whole-tile counter. Drag a tile to pick any amount.</div>
    </div>
    <div><label>Tile shows</label>
      <div class="seg" id="segShow" data-show="${show}">
        ${PERIODS.map(([p,l])=>`<button class="${show===p?'sel':''}" onclick="pickSeg(this,'show','${p}')">${l}</button>`).join('')}
      </div></div>
    <div><label>Color</label><div class="swatches" data-color="${sel}">${sw}</div></div>
    <button class="save tapbtn" onclick="saveForm(${a?`'${a.id}'`:'null'})">${a?'Save':'Create counter'}</button>
    ${a?`<button class="danger" onclick="delAcc('${a.id}')">Delete this counter</button>`:''}
  </div>`;
}

/* ---------- form actions ---------- */
function pickColor(el,c){
  el.parentElement.dataset.color = c;
  el.parentElement.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
function pickSeg(el,key,v){
  el.parentElement.dataset[key] = v;
  el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function parseTimeStr(s){
  s = s.trim();
  if(!s) return NaN;
  if(s.includes(':')){
    const parts = s.split(':');
    return (parseInt(parts[0])||0)*60 + (parseInt(parts[1])||0);
  }
  return Math.round(parseFloat(s));
}
function saveForm(id){
  const name = $('#fName').value.trim();
  if(!name){ $('#fName').focus(); return; }
  const unit = $('#fUnit').value.trim();
  const group = $('#fGroup').value.trim();
  const color = $('.swatches').dataset.color;
  const show = $('#segShow').dataset.show || 'today';
  let tap = parseFloat($('#fTap').value);
  if(!isFinite(tap) || tap===0) tap = 1;
  let sub = Math.abs(parseFloat($('#fSub').value));
  if(!isFinite(sub)) sub = 0;
  if(id){
    Object.assign(findAcc(id),{name,unit,group,color,show,tap,sub});
  }else{
    state.accs.push({id:'a'+Date.now(),kind:'tally',name,unit,group,color,show,tap,sub,lifetime:0,byDay:{}});
  }
  save(); go('home');
}
function delAcc(id){
  if(!confirm('Delete this counter and all its history?')) return;
  state.accs = state.accs.filter(a=>a.id!==id);
  if(lastAdd && lastAdd.accId===id) lastAdd = null;
  save(); go('home');
}
function go(name,id){
  closeSheet();
  editMode = false;
  view = {name, id};
  render();
  window.scrollTo(0,0);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();

// Offline support: register the service worker when running as a real site.
// (Skipped in preview sandboxes and file:// where it isn't available.)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
</body>
