<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ClickTrack</title>
<meta name="theme-color" content="#E9EDF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClickTrack">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EDF0; --ink:#14202B; --ink-soft:#5B6B78; --panel:#FFFFFF;
    --line:#CDD6DD; --press:#DCE3E8;
    --c1:#E4572E; --c2:#2F9E44; --c3:#2458C5; --c4:#8E44AD; --c5:#D9A404; --c6:#0E7C86;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    font-variation-settings:'wdth' 88;
    overscroll-behavior:none;
  }
  #app{max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}

  /* ---------- shared ---------- */
  button{font:inherit; border:none; cursor:pointer; color:inherit; background:none;}
  .tapbtn{transition:transform .06s ease;}
  .tapbtn:active{transform:scale(.96);}
  input[type=text],input[type=number]{
    font:inherit; font-weight:600; color:var(--ink);
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:12px 14px; width:100%;
  }
  input:focus{outline:none; border-color:var(--ink);}
  select{
    font:inherit; font-weight:600; color:var(--ink); background:var(--panel);
    border:2px solid var(--line); border-radius:10px; padding:12px 14px; width:100%;
    -webkit-appearance:none; appearance:none;
  }
  select:focus{outline:none; border-color:var(--ink);}

  /* ---------- home ---------- */
  header.home{padding:22px 18px 6px;}
  .h-row{display:flex; align-items:center; justify-content:space-between;}
  header.home h1{
    margin:0; font-size:28px; font-weight:900; letter-spacing:-.02em;
    font-variation-settings:'wdth' 78;
  }
  header.home p{margin:4px 0 0; color:var(--ink-soft); font-size:13px;}
  .newbtn2{
    background:var(--ink); color:#fff; font-weight:700; font-size:14px;
    padding:10px 16px; border-radius:999px;
  }
  .h-btns{display:flex; gap:8px;}
  .editbtn{
    background:none; border:2px solid var(--line); color:var(--ink-soft);
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px;
  }
  .editbtn.on{background:var(--c1); border-color:var(--c1); color:#fff;}
  /* edit mode: tiles jiggle, get an × badge, and can be dragged to reorder */
  .board.editing .tile{outline:2px dashed rgba(255,255,255,.8); outline-offset:-5px; animation:editpulse 1.2s ease-in-out infinite; touch-action:none;}
  @keyframes editpulse{50%{transform:scale(.97);}}
  .tile .t-del{
    display:none; position:absolute; top:-7px; left:-7px; width:24px; height:24px; z-index:2;
    border-radius:50%; background:var(--ink); color:#fff; font-size:15px; font-weight:900;
    line-height:24px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .board.editing .t-del{display:block;}
  .board.editing .t-name{padding-left:12px;}
  .tile.placeholder{opacity:.3; animation:none;}
  .tile.ghost{
    position:fixed; z-index:30; margin:0; pointer-events:none; animation:none; outline:none;
    transform:scale(1.08); box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .board{flex:1; padding:4px 14px 20px;}
  .group{border:2px dashed transparent; border-radius:16px; margin:0 -6px; padding:0 6px;}
  .group-h{margin:18px 4px 8px; font-size:14px; font-weight:800; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .group-h .grip{display:none; letter-spacing:-.15em; color:var(--line); font-size:16px; line-height:1;}
  /* edit mode: each group sits in a dashed box; drag the header to reorder groups */
  .board.editing .group{border-color:var(--line); margin:10px -6px 0; padding:2px 6px 8px;}
  .board.editing .group-h{margin-top:6px; padding:6px 0; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
  .board.editing .grip{display:inline;}
  .group.placeholder{opacity:.3;}
  .group.ghost{
    position:fixed; z-index:30; margin:0; pointer-events:none; background:var(--bg);
    border-color:var(--ink-soft); box-shadow:0 14px 30px rgba(0,0,0,.3);
  }
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:7px;}
  .tile{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:0; text-align:left;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none;
    color:#fff; border-radius:14px; padding:8px 9px 7px; min-height:78px;
    background:var(--tile-c,#888);
    background:
      radial-gradient(130% 90% at 18% 0%, rgba(255,255,255,.30), rgba(255,255,255,0) 55%),
      linear-gradient(160deg,
        color-mix(in srgb, var(--tile-c) 86%, #fff) 0%,
        var(--tile-c) 55%,
        color-mix(in srgb, var(--tile-c) 80%, #000) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.18),
      0 3px 8px color-mix(in srgb, var(--tile-c) 35%, transparent);
  }
  .tile:active{
    box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.15);
  }
  /* vertical dot column on the right edge: which of the flick-up/down views is on */
  .tile .t-dots{position:absolute; top:27px; right:7px; display:flex; flex-direction:column; gap:3px;}
  .tile .t-dots i{display:block; width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.38);}
  .tile .t-dots i.on{background:#fff; box-shadow:0 0 2px rgba(0,0,0,.3);}
  .tile .t-name{
    font-size:10.5px; font-weight:700; width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; opacity:.95;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .tile .t-count{
    font-size:22px; font-weight:900; font-variant-numeric:tabular-nums;
    margin-top:auto; line-height:1; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.22);
    font-variation-settings:'wdth' 80;
  }
  /* every tile: name / number / unit line (measurements add the change; ratios show the result unit) */
  .tile .t-sub{
    display:block; height:10px; line-height:10px; margin-top:3px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:9px; font-weight:700; color:rgba(255,255,255,.85); letter-spacing:.02em;
  }
  .tile .t-count,.tile.split .t-count{margin-bottom:0;}
  .tile .t-sub{margin-bottom:12px;}
  .tile.split .t-sub{margin-bottom:15px;}
  .tile.ratio .t-sub{margin-bottom:2px;}
  .tile.ratio{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), 0 3px 8px color-mix(in srgb, var(--tile-c) 35%, transparent);}
  .tile .t-tap,.tile .t-minus{
    position:absolute; bottom:5px;
    font-size:9px; font-weight:800; color:rgba(255,255,255,.9);
    background:rgba(0,0,0,.20); padding:2px 6px; border-radius:999px;
  }
  .tile .t-tap{right:6px;}
  .tile .t-minus{left:6px;}
  /* split tile: left third subtracts, right two-thirds add */
  .tile.split::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:36%;
    background:rgba(0,0,0,.13); border-radius:14px 0 0 14px; pointer-events:none;
  }
  .tile>span{position:relative;}
  .empty{
    margin:40px 24px; text-align:center; color:var(--ink-soft); font-size:15px; line-height:1.5;
  }
  .undo{display:block; margin:6px auto 0; color:var(--ink-soft); font-size:13px; padding:8px 14px; text-decoration:underline;}
  /* drag-to-pick-amount readout */
  .scrub{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:20; pointer-events:none; width:calc(100% - 28px); max-width:492px;
    background:var(--panel); border-radius:16px; padding:12px 18px 14px; text-align:center;
    box-shadow:0 8px 24px rgba(20,32,43,.28);
  }
  .scrub-track{height:8px; background:var(--press); border-radius:4px; margin-top:10px; display:flex; position:relative;}
  .scrub-track::after{content:''; position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ink-soft); border-radius:1px;}
  .scrub-fill{height:100%; border-radius:4px; min-width:0;}
  .scrub-val{
    font-size:46px; font-weight:900; line-height:1; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; font-variation-settings:'wdth' 78;
  }
  .scrub-sub{margin-top:6px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bump{animation:bump .18s ease;}
  @keyframes bump{40%{transform:scale(1.06);}}

  /* ---------- counter page ---------- */
  .d-top{display:flex; align-items:center; padding:14px 10px 0; gap:6px;}
  .d-top .back{padding:10px 12px; font-weight:700; font-size:15px; color:var(--ink-soft);}
  .d-top .d-title{flex:1; text-align:center; font-weight:800; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .statrow{
    display:flex; justify-content:space-around; gap:8px; padding:14px 16px 6px;
    border-bottom:2px solid var(--line); margin:0 20px 4px;
  }
  .stat{text-align:center; min-width:0;}
  .stat b{display:block; font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--acc); font-variation-settings:'wdth' 80;}
  .stat span{font-size:11px; color:var(--ink-soft); font-weight:600;}

  /* ---------- timer bar ---------- */
  .timerbar{
    margin-top:auto; background:var(--panel); border-top:2px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .timerbar .t-row{display:flex; align-items:center; gap:10px;}
  .timerbar .t-time{
    font-size:34px; font-weight:900; font-variant-numeric:tabular-nums; min-width:110px;
  }
  .timerbar .t-time.done{color:var(--c1);}
  .t-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .t-chips button{
    background:var(--press); font-weight:700; font-size:13px;
    padding:9px 14px; border-radius:999px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  }
  .t-chips button.reset{background:none; border:2px solid var(--line); color:var(--ink-soft);}
  .t-main{
    margin-left:auto; background:var(--acc); color:#fff; font-weight:800;
    font-size:15px; padding:12px 20px; border-radius:12px; min-width:88px;
  }
  .t-main.running{background:var(--ink);}
  .t-track{height:6px; background:var(--press); border-radius:3px; margin-top:10px; overflow:hidden;}
  .t-fill{height:100%; background:var(--acc); width:0%; border-radius:3px;}

  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; background:var(--panel); border:2px solid var(--line);
    border-radius:10px; padding:11px 4px; font-weight:700; font-size:14px;
  }
  .seg button.sel{border-color:var(--ink); background:var(--press);}

  /* ---------- warn ---------- */
  .warnbar{
    margin:8px 14px 0; padding:10px 14px; border-radius:10px;
    background:#FBE9E2; color:#8C3A21; font-size:13px; font-weight:600; line-height:1.4;
  }

  /* ---------- form ---------- */
  .form{padding:10px 20px 40px; display:flex; flex-direction:column; gap:16px;}
  .form label,.sheet label{font-size:13px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .form .row{display:flex; gap:10px;}
  .form .row>div{flex:1; min-width:0;}
  .swatches{display:flex; gap:10px;}
  .swatch{width:40px; height:40px; border-radius:50%; border:3px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .form .save{
    background:var(--ink); color:#fff; font-weight:800; font-size:16px;
    padding:16px; border-radius:12px;
  }
  .form .danger{color:var(--c1); font-weight:700; padding:12px; font-size:14px;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .hint.ok{color:var(--c2);} .hint.bad{color:var(--c1);}
  .mini{display:flex; gap:8px; margin-top:8px;}
  .mini>div{flex:1; min-width:0;}
  .mini label{font-size:11px; margin-bottom:4px;}

  /* ---------- sheet (hold a timer button) ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:10; background:rgba(20,32,43,.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--panel); width:100%; max-width:520px;
    border-radius:18px 18px 0 0; display:flex; flex-direction:column; gap:14px;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h3{margin:0; font-size:17px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet input{font-size:18px;}
  .sheet .row{display:flex; gap:10px; align-items:center;}
  .sheet .done{
    flex:1; background:var(--ink); color:#fff; font-weight:800; font-size:16px;
    padding:14px; border-radius:12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const COLORS = ['#E4572E','#2F9E44','#2458C5','#8E44AD','#D9A404','#0E7C86'];
const KEY = 'clicktrack-v1';
let state = { accs: [] };
let view = { name:'home' };
let timers = {};    // timer runtime: {left,total,running,int}
let lastAdd = null; // {accId, amount, dayKey}
let editMode = false;   // header Edit → tap a tile to open its page

/* ---------- storage ---------- */
// Uses Claude artifact storage when available; falls back to the browser's
// localStorage when published as a normal web page (e.g. GitHub Pages).
const store = (window.storage && window.storage.get) ? window.storage : {
  async get(k){
    const v = localStorage.getItem(k);
    if(v === null) throw new Error('missing key');
    return {key:k, value:v};
  },
  async set(k,v){ localStorage.setItem(k, v); return {key:k, value:v}; }
};
let storageOK = null;   // null = unknown, true = working, false = unavailable
let saveTimer = null;

async function load(){
  try{
    const r = await store.get(KEY);
    storageOK = true;
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){
    // get() throws on a missing key too, so probe with a write before giving up
    try{
      await store.set(KEY+'-probe','1');
      storageOK = true;
    }catch(e2){
      storageOK = false;
    }
  }
  migrate();
  render();
}

// bring older saved counters up to the current shape
function migrate(){
  (state.accs || []).forEach(a=>{
    if(!a.kind) a.kind = 'tally';
    if(!isFinite(a.tap) || a.tap===0) a.tap = 1;
    if(a.split === false) a.sub = 0;                          // pre-Sept-2026 "whole tile" flag
    else if(!isFinite(a.sub)) a.sub = Math.abs(a.tap);        // no subtract amount ever saved: default to split
    // (a saved sub of 0 means the user chose a whole-tile counter; leave it alone)
    if(a.show === 'lifetime') a.show = 'all';
    if(!a.show) a.show = 'today';
    if(!a.byDay) a.byDay = {};
    delete a.split; delete a.presets; delete a.timers;
  });
}

// debounce rapid taps into one write
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 300);
}

async function doSave(){
  if(storageOK === false) return; // in-memory mode
  const payload = JSON.stringify(state);
  for(let i=0; i<3; i++){
    try{
      await store.set(KEY, payload);
      if(storageOK !== true){ storageOK = true; render(); }
      return;
    }catch(e){
      await new Promise(r=>setTimeout(r, 400*(i+1)));
    }
  }
  if(storageOK !== false){ storageOK = false; render(); }
}

function warnbar(){
  return storageOK === false
    ? `<div class="warnbar">Saving is unavailable right now — counts will reset when you close this. Your taps still work.</div>`
    : '';
}

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
function dayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n){
  if(!isFinite(n)) return '0';
  return (Math.round(n*100)/100).toLocaleString();
}
function findAcc(id){ return state.accs.find(a=>a.id===id); }
function prune(acc){
  const keys = Object.keys(acc.byDay).sort();
  while(keys.length > 400) delete acc.byDay[keys.shift()];
}
// first day (Monday) of the current week, as a day key
function weekStartKey(){
  const d = new Date();
  const back = (d.getDay() + 6) % 7;   // Mon=0 … Sun=6
  d.setDate(d.getDate() - back);
  return dayKey(d);
}
function sumSince(acc, fromKey){
  return Object.entries(acc.byDay).reduce((s,[k,v])=> k >= fromKey ? s+v : s, 0);
}
const PERIODS = [['today','Today'],['week','Week'],['month','Month'],['all','All time']];
function periodValue(acc, p){
  if(p==='week') return sumSince(acc, weekStartKey());
  if(p==='month') return sumSince(acc, dayKey().slice(0,7)+'-01');
  if(p==='all') return acc.lifetime || 0;
  return acc.byDay[dayKey()] || 0;
}
function isLevel(a){ return a.kind === 'level'; }
// measurement counters store the value set on each day; "current" is the newest entry
function levelEntries(a){ return Object.keys(a.byDay).sort().map(k=>[k, a.byDay[k]]); }
function levelCurrent(a){ const e = levelEntries(a); return e.length ? e[e.length-1][1] : 0; }
function levelPrev(a){ const e = levelEntries(a); return e.length > 1 ? e[e.length-2][1] : null; }
function levelAvg(a, days){
  const d = new Date(); d.setDate(d.getDate() - (days-1));
  const from = dayKey(d);
  const vals = levelEntries(a).filter(([k])=> k >= from).map(([,v])=>v);
  return vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : levelCurrent(a);
}
const LEVEL_STATS = [['now','Now'],['change','Change'],['avg7','7-day avg'],['avg30','30-day avg']];
function levelStat(a, key){
  if(key==='change'){ const p = levelPrev(a); return p===null ? 0 : levelCurrent(a) - p; }
  if(key==='avg7') return levelAvg(a, 7);
  if(key==='avg30') return levelAvg(a, 30);
  return levelCurrent(a);
}
/* ---------- units ----------
   A small built-in table. A counter's unit is free text; it's matched to the
   table by alias, or the user picks a match from a dropdown. Unknown units act
   as labels: they only convert to themselves. */
const UNITS = [
  {id:'mi',  dim:'distance', f:1609.344,  name:'miles',        al:['mi','mile','miles']},
  {id:'km',  dim:'distance', f:1000,      name:'kilometers',   al:['km','kms','k','kilometer','kilometers','kilometre','kilometres']},
  {id:'m',   dim:'distance', f:1,         name:'meters',       al:['m','meter','meters','metre','metres']},
  {id:'ft',  dim:'distance', f:0.3048,    name:'feet',         al:['ft','foot','feet']},
  {id:'yd',  dim:'distance', f:0.9144,    name:'yards',        al:['yd','yds','yard','yards']},
  {id:'s',   dim:'time',     f:1,         name:'seconds',      al:['s','sec','secs','second','seconds']},
  {id:'min', dim:'time',     f:60,        name:'minutes',      al:['min','mins','minute','minutes']},
  {id:'h',   dim:'time',     f:3600,      name:'hours',        al:['h','hr','hrs','hour','hours']},
  {id:'day', dim:'time',     f:86400,     name:'days',         al:['d','day','days']},
  {id:'lb',  dim:'mass',     f:0.45359237,name:'pounds',       al:['lb','lbs','pound','pounds']},
  {id:'kg',  dim:'mass',     f:1,         name:'kilograms',    al:['kg','kgs','kilo','kilos','kilogram','kilograms']},
  {id:'g',   dim:'mass',     f:0.001,     name:'grams',        al:['g','gram','grams']},
  {id:'oz',  dim:'mass',     f:0.028349523125, name:'ounces',  al:['oz','ounce','ounces']},
  {id:'L',   dim:'volume',   f:1,         name:'liters',       al:['l','liter','liters','litre','litres']},
  {id:'mL',  dim:'volume',   f:0.001,     name:'milliliters',  al:['ml','milliliter','milliliters','millilitre','millilitres']},
  {id:'floz',dim:'volume',   f:0.0295735, name:'fluid ounces', al:['floz','fl.oz','fluidounce','fluidounces']},
  {id:'cup', dim:'volume',   f:0.2365882, name:'cups',         al:['cup','cups']},
  {id:'gal', dim:'volume',   f:3.78541,   name:'gallons',      al:['gal','gals','gallon','gallons']},
];
const COMPOUND = {mph:['mi','h'], kph:['km','h'], kmh:['km','h'], mps:['m','s'], fps:['ft','s']};
const DIM_NAME = {distance:'distance', time:'time', mass:'weight', volume:'volume'};
const normU = t => String(t||'').toLowerCase().replace(/[\s.]/g,'');
function unitById(id){ return UNITS.find(u=>u.id===id) || null; }
function matchUnit(text){ const n = normU(text); return n ? (UNITS.find(u=>u.al.includes(n)) || null) : null; }
function labelUnit(text){ const n = normU(text); return n ? {id:n, dim:null, f:1, name:String(text).trim()} : null; }
// what a counter's unit means: a table entry (matched or chosen), else a label-only unit
function unitOf(a){
  if(!a) return null;
  return (a.unitId && unitById(a.unitId)) || matchUnit(a.unit) || labelUnit(a.unit);
}
// "mph", "km/h", "min/mi", "reps/h" → [numUnit, denUnit], label-only sides allowed; null if not a pair
function parseCompound(text){
  const n = normU(text);
  if(!n) return null;
  if(COMPOUND[n]) return COMPOUND[n].map(unitById);
  const parts = n.split('/');
  if(parts.length !== 2 || !parts[0] || !parts[1]) return null;
  return parts.map(x => matchUnit(x) || labelUnit(x));
}
function sameDim(a, b){ return !!(a && b && (a.dim ? a.dim === b.dim : (b.dim === null && a.id === b.id))); }
function unitOptions(sel, dim){   // <option>s for a unit dropdown, optionally limited to one dimension
  return UNITS.filter(u=>!dim || u.dim===dim).map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${u.name} (${u.id})</option>`).join('');
}
function isRatio(a){ return a.kind === 'ratio'; }
// how a ratio gets from its sources' units to the unit it should show:
//   {k: factor (NaN = incompatible), auto: derived from units?, msg: explanation}
function ratioConv(a){
  const n = findAcc(a.num), d = findAcc(a.den);
  const un = unitOf(n), ud = unitOf(d);
  const manual = (isFinite(a.scale) && a.scale !== 0) ? a.scale : 1;
  const chosen = (a.showNum || a.showDen) ? [a.showNum ? unitById(a.showNum) : null, a.showDen ? unitById(a.showDen) : null] : null;
  const t = chosen || parseCompound(a.unit);
  if(!t || (!t[0] && !t[1])){
    return {k:manual, auto:false, msg: normU(a.unit) ? `"${a.unit}" isn't a unit I know. Pick what it means, or multiply by hand.` : 'Type a unit like mph, km/h or min/mi, or multiply by hand.'};
  }
  if(!un || !ud) return {k:manual, auto:false, msg:'Give both source counters a unit to convert automatically.'};
  const tn = t[0] || un, td = t[1] || ud;   // a missing side keeps the source unit
  if(!sameDim(un, tn)) return {k:NaN, auto:true, msg:`${n.name} is in ${un.name}, which can't become ${tn.name}.`};
  if(!sameDim(ud, td)) return {k:NaN, auto:true, msg:`${d.name} is in ${ud.name}, which can't become ${td.name}.`};
  const k = (un.f / ud.f) / (tn.f / td.f);
  return {k, auto:true, msg:`${un.id}/${ud.id} → ${tn.id}/${td.id}, ×${fmt(k)}`, tn, td};
}
// ratio counters divide two tallies over the same period (miles ÷ hours = speed)
function ratioValue(a, p){
  const n = findAcc(a.num), d = findAcc(a.den);
  if(!n || !d) return NaN;
  const dv = periodValue(d, p);
  return dv ? periodValue(n, p) / dv * ratioConv(a).k : NaN;
}
function fmtRatio(v){ return isFinite(v) ? fmt(v) : '—'; }
function tallies(){ return state.accs.filter(a=>(a.kind||'tally')==='tally'); }
function levelKey(a){ return LEVEL_STATS.some(([k])=>k===a.show) ? a.show : 'now'; }
function tileValue(a){
  if(isLevel(a)) return levelStat(a, levelKey(a));
  if(isRatio(a)) return ratioValue(a, a.show);
  return periodValue(a, a.show);
}
// what the tile is showing, for its unit line ('' for the default: today / now)
const SHORT_LABEL = {week:'wk', month:'mo', all:'all', change:'Δ', avg7:'7d avg', avg30:'30d avg'};
function showKeys(a){ return (isLevel(a) ? LEVEL_STATS : PERIODS).map(([k])=>k); }
function showKey(a){ return isLevel(a) ? levelKey(a) : (PERIODS.some(([k])=>k===a.show) ? a.show : 'today'); }
function periodLabel(a){ return SHORT_LABEL[showKey(a)] || ''; }
// four dots in the tile corner: which of the flick-able views is on
function dotsHTML(a){
  const cur = showKey(a);
  return `<span class="t-dots">${showKeys(a).map(k=>`<i class="${k===cur?'on':''}"></i>`).join('')}</span>`;
}
// flick up/down on a tile: step through today / week / month / all time (or a measurement's stats)
function cycleShow(id, dir){
  const a = findAcc(id);
  if(!a) return;
  const keys = showKeys(a), cur = showKey(a);
  a.show = keys[(keys.indexOf(cur) + dir + keys.length) % keys.length];
  if(navigator.vibrate) navigator.vibrate(8);
  save(); render();
  const el = $('#tile-'+id+' .t-count');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

/* ---------- beep ---------- */
let actx = null;
function beep(){
  if(!actx) return;
  [0,.35,.7].forEach(t=>{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='square'; o.frequency.value=880;
    g.gain.setValueAtTime(.001, actx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.3, actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.3);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.32);
  });
}

/* ---------- actions ---------- */
function addAmount(id, amt){
  const acc = findAcc(id);
  if(!acc || !isFinite(amt) || amt===0) return;
  const k = dayKey();
  acc.byDay[k] = (acc.byDay[k]||0) + amt;
  acc.lifetime = (acc.lifetime||0) + amt;
  prune(acc);
  lastAdd = {accId:id, amount:amt, dayKey:k};
  save(); render();
  const el = $('#tile-'+id+' .t-count');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
// measurement: record today's value (overwrites today's earlier entry)
function setLevel(id, v){
  const acc = findAcc(id);
  if(!acc || !isFinite(v)) return;
  const k = dayKey();
  v = Math.round(v*100)/100;
  if(acc.byDay[k] === v) return;
  lastAdd = {accId:id, kind:'level', dayKey:k, prev:acc.byDay[k], from:levelCurrent(acc), to:v};
  acc.byDay[k] = v;
  prune(acc);
  save(); render();
  const el = $('#tile-'+id+' .t-count');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function undo(){
  if(!lastAdd) return;
  const acc = findAcc(lastAdd.accId);
  if(acc && lastAdd.kind==='level'){
    if(lastAdd.prev === undefined) delete acc.byDay[lastAdd.dayKey];
    else acc.byDay[lastAdd.dayKey] = lastAdd.prev;
  }else if(acc){
    acc.byDay[lastAdd.dayKey] = (acc.byDay[lastAdd.dayKey]||0) - lastAdd.amount;
    acc.lifetime -= lastAdd.amount;
  }
  lastAdd = null; save(); render();
}
function undoLabel(){
  const a = findAcc(lastAdd.accId);
  if(!a) return '';
  if(lastAdd.kind==='level') return `Undo · ${esc(a.name)} back to ${fmt(lastAdd.from)}`;
  return `Undo ${signed(lastAdd.amount)} on ${esc(a.name)}`;
}
function signed(v){ return (v < 0 ? '−' : '+') + fmt(Math.abs(v)); }

/* ---------- timer ---------- */
function homeTimers(){ return state.homeTimers || [30,60,90]; }
function tstate(id, def){
  if(!timers[id]) timers[id] = {left:def||60, total:def||60, running:false, int:null};
  return timers[id];
}
function toggleTimer(id){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  const t = tstate(id);
  if(t.running){
    clearInterval(t.int); t.running=false;
  }else{
    if(t.left<=0) t.left = t.total;
    t.running = true;
    t.int = setInterval(()=>{
      t.left--;
      if(t.left<=0){
        clearInterval(t.int); t.running=false; t.left=0; beep();
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
      updateTimerUI(id);
    },1000);
  }
  updateTimerUI(id);
}
function setTimerTo(id, s){
  const t = tstate(id);
  clearInterval(t.int); t.running = false;
  t.left = t.total = s;
  updateTimerUI(id);
}
function resetTimer(id){
  const t = tstate(id);
  clearInterval(t.int); t.running = false;
  t.left = t.total;
  updateTimerUI(id);
}
function fmtTime(s){
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function updateTimerUI(id){
  const t = tstate(id);
  const time = $('.t-time'), main = $('.t-main'), fill = $('.t-fill');
  if(!time) return;
  time.textContent = fmtTime(t.left);
  time.classList.toggle('done', t.left===0 && !t.running);
  main.textContent = t.running ? 'Pause' : (t.left===0 ? 'Restart' : 'Start');
  main.classList.toggle('running', t.running);
  fill.style.width = t.total ? (100*(t.total-t.left)/t.total)+'%' : '0%';
}

function timerBarHTML(id, presets){
  return `
    <div class="timerbar">
      <div class="t-row">
        <div class="t-time">${fmtTime(presets[0])}</div>
        <button class="t-main tapbtn" onclick="toggleTimer('${id}')">Start</button>
      </div>
      <div class="t-chips">
        ${presets.map((s,i)=>`<button class="tapbtn"
          onpointerdown="chipDown(event,'${id}',${i})"
          onpointermove="pressMove(event)"
          onpointerup="chipUp(event,'${id}',${i})"
          onpointercancel="cancelPress()"
          oncontextmenu="return false">${fmtTime(s)}</button>`).join('')}
        <button class="reset tapbtn" onclick="resetTimer('${id}')">Reset</button>
      </div>
      <div class="t-track"><div class="t-fill"></div></div>
    </div>`;
}

/* ---------- views ---------- */
function render(){
  const app = $('#app');
  if(view.name==='home') app.innerHTML = homeView();
  else if(view.name==='counter'){ app.innerHTML = counterView(view.id); unitHint(); ratioHint(); }
  if(view.name==='home'){
    tstate('_home', homeTimers()[0]);
    updateTimerUI('_home');
  }
}

function groupOf(a){ return (a.group||'').trim() || 'Other'; }
// groups in the user's saved order first, then any new ones alphabetically (Other last)
function groupNames(){
  const present = [...new Set(state.accs.map(groupOf))];
  const order = (state.groupOrder||[]).filter(g=>present.includes(g));
  const rest = present.filter(g=>!order.includes(g)).sort((x,y)=>(x==='Other')-(y==='Other') || x.localeCompare(y));
  return [...order, ...rest];
}
function homeView(){
  const groups = {};
  state.accs.forEach(a=>{ (groups[groupOf(a)] = groups[groupOf(a)] || []).push(a); });
  const names = groupNames();
  const sections = names.map(g=>`
    <div class="group" data-group="${esc(g)}">
      ${(names.length>1 || g!=='Other') ? `<div class="group-h" onpointerdown="groupDown(event)" oncontextmenu="return false"><span class="grip">⋮⋮</span><span>${esc(g)}</span></div>` : ''}
      <div class="tiles" data-group="${esc(g)}">${groups[g].map(tileHTML).join('')}</div>
    </div>`).join('');
  const last = lastAdd && findAcc(lastAdd.accId);
  return `
    <header class="home">
      <div class="h-row">
        <h1>ClickTrack</h1>
        <div class="h-btns">
          ${state.accs.length ? `<button class="editbtn tapbtn ${editMode?'on':''}" onclick="toggleEdit()">${editMode?'Cancel':'Edit'}</button>` : ''}
          <button class="newbtn2 tapbtn" onclick="go('counter',null)">+ New</button>
        </div>
      </div>
      <p>${editMode ? 'Tap a tile to edit it · drag tiles or group headers to reorder · × to delete' : 'Tap to count · drag for an amount · flick up/down for the period · hold a timer to edit it'}</p>
    </header>
    ${warnbar()}
    <div class="board ${editMode?'editing':''}" onpointermove="boardMove(event)" onpointerup="boardUp(event)" onpointercancel="boardCancel()">
      ${state.accs.length ? sections : `<div class="empty">Nothing here yet.<br>Count reps, miles or jinxes, or track a number like your weight.</div>`}
      ${last && !editMode ? `<button class="undo tapbtn" onclick="undo()">${undoLabel()}</button>` : ''}
    </div>
    ${timerBarHTML('_home', homeTimers())}`;
}
function isSplit(a){ return isFinite(a.sub) && a.sub > 0; }
function addAmt(a){ return Math.abs(isFinite(a.tap) ? a.tap : 1); }
function subAmt(a){ return a.sub; }
function levelDelta(a){
  const p = levelPrev(a);
  if(p === null) return '';
  const d = levelCurrent(a) - p;
  if(Math.abs(d) < 0.005) return '= no change';
  return (d > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(d));
}
function tileHTML(a){
  if(isRatio(a)){
    const n = findAcc(a.num), d = findAcc(a.den);
    return `
    <button class="tile tapbtn ratio" id="tile-${a.id}" data-id="${a.id}" style="--tile-c:${a.color}"
      onpointerdown="tileDown(event,'${a.id}')"
      onpointermove="tileMove(event,'${a.id}')"
      onpointerup="tileUp(event,'${a.id}')"
      onpointercancel="tileCancel()"
      oncontextmenu="return false">
      <span class="t-del">×</span>
      <span class="t-name">${esc(a.name)}</span>
      ${dotsHTML(a)}
      <span class="t-count">${fmtRatio(tileValue(a))}</span>
      <span class="t-sub">${!(n && d) ? 'pick two counters' : !isFinite(ratioConv(a).k) ? 'unit mismatch' : esc([a.unit || (n.name+' ÷ '+d.name), periodLabel(a)].filter(Boolean).join(' · '))}</span>
    </button>`;
  }
  const tap = isFinite(a.tap) ? a.tap : 1;
  const split = isSplit(a);
  const badge = (split || tap>0 ? '+' : '−') + fmt(Math.abs(tap));
  return `
    <button class="tile tapbtn ${split?'split':''} ${isLevel(a)?'level':''}" id="tile-${a.id}" data-id="${a.id}" style="--tile-c:${a.color}"
      onpointerdown="tileDown(event,'${a.id}')"
      onpointermove="tileMove(event,'${a.id}')"
      onpointerup="tileUp(event,'${a.id}')"
      onpointercancel="tileCancel()"
      oncontextmenu="return false">
      <span class="t-del">×</span>
      <span class="t-name">${esc(a.name)}</span>
      ${dotsHTML(a)}
      <span class="t-count">${isLevel(a) && levelKey(a)==='change' ? signed(tileValue(a)) : fmt(tileValue(a))}</span>
      <span class="t-sub">${esc([a.unit, isLevel(a) && levelKey(a)==='now' ? levelDelta(a) : periodLabel(a)].filter(Boolean).join(' · '))}</span>
      ${split ? `<span class="t-minus">−${fmt(subAmt(a))}</span>` : ''}
      <span class="t-tap">${badge}</span>
    </button>`;
}

/* generic tap-vs-hold: short press = onTap, ~450ms hold = onLong */
const SPLIT_AT = 0.36;   // fraction of tile width that is the "−" zone
let pressInfo = null;
function pressDown(ev, key, onLong){
  cancelPress();
  pressInfo = {key, x:ev.clientX, y:ev.clientY, t0:Date.now(), long:false, t:null};
  if(onLong) pressInfo.t = setTimeout(()=>{
    if(pressInfo && pressInfo.key===key){
      pressInfo.long = true;
      if(navigator.vibrate) navigator.vibrate(15);
      onLong();
    }
  }, 450);
}
function pressMove(ev){
  if(pressInfo && (Math.abs(ev.clientX-pressInfo.x)>12 || Math.abs(ev.clientY-pressInfo.y)>12)) cancelPress();
}
// returns true when the release completes a short tap
function pressUp(key){
  if(!pressInfo || pressInfo.key!==key){ cancelPress(); return false; }
  const wasLong = pressInfo.long;
  cancelPress();
  return !wasLong;
}
function cancelPress(){
  if(pressInfo) clearTimeout(pressInfo.t);
  pressInfo = null;
}

/* tiles: tap = count (left third subtracts on split tiles),
   drag sideways = scrub an arbitrary amount and apply it once on release,
   in edit mode a tap opens the counter page */
function tileSide(ev, a){   // -1 = left (subtract) zone, +1 = right (add) zone
  if(!isSplit(a)) return 1;
  const r = ev.currentTarget.getBoundingClientRect();
  return (ev.clientX - r.left) < r.width*SPLIT_AT ? -1 : 1;
}
function tileTapAmount(a, side){
  if(!isSplit(a)) return isFinite(a.tap) ? a.tap : 1;
  return side < 0 ? -subAmt(a) : addAmt(a);
}
function toggleEdit(){ editMode = !editMode; render(); }
function tileDown(ev, id){
  const a = findAcc(id);
  if(!a) return;
  if(editMode){ editDown(ev, id); return; }
  try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}
  pressDown(ev, 'tile-'+id, null);
  pressInfo.side = tileSide(ev, a);
  pressInfo.noTap = isRatio(a);   // computed tile: only the vertical flick does anything
}
function tileMove(ev, id){
  if(drag){ boardMove(ev); return; }
  if(scrub){ scrubUpdate(ev.clientX); return; }
  if(!pressInfo || pressInfo.key!=='tile-'+id) return;
  const dx = ev.clientX - pressInfo.x, dy = ev.clientY - pressInfo.y;
  if(pressInfo.axis === 'y'){
    // a slow vertical drag scrolls the page by hand; a quick one is a flick (handled on release)
    if(!pressInfo.scrolling && Date.now() - pressInfo.t0 > 220) pressInfo.scrolling = true;
    if(pressInfo.scrolling) window.scrollBy(0, pressInfo.lastY - ev.clientY);
    pressInfo.lastY = ev.clientY;
    return;
  }
  if(Math.abs(dx) > 12 && Math.abs(dx) >= Math.abs(dy)){ if(pressInfo.noTap) cancelPress(); else scrubBegin(id, pressInfo.side, ev.clientX); }
  else if(Math.abs(dy) > 12){ pressInfo.axis = 'y'; pressInfo.lastY = ev.clientY; pressInfo.scrolling = Date.now() - pressInfo.t0 > 220; }
}
function tileUp(ev, id){
  if(drag){ boardUp(ev); return; }
  if(scrub){ scrubEnd(true); return; }
  if(pressInfo && pressInfo.key==='tile-'+id && pressInfo.axis === 'y'){
    const dy = ev.clientY - pressInfo.y, flick = !pressInfo.scrolling && Math.abs(dy) >= 30;
    cancelPress();
    if(flick) cycleShow(id, dy < 0 ? 1 : -1);   // up = next period, down = previous
    return;
  }
  const noTap = pressInfo && pressInfo.noTap;
  if(!pressUp('tile-'+id) || noTap) return;
  const a = findAcc(id);
  if(!a) return;
  const amt = tileTapAmount(a, tileSide(ev, a));
  if(isLevel(a)) setLevel(id, levelCurrent(a) + amt);
  else addAmount(id, amt);
}
function tileCancel(){ boardCancel(); scrubEnd(false); cancelPress(); }

/* ---------- edit mode: tap opens the page, × deletes, drag reorders / regroups ----------
   The board captures the pointer so the dragged tile can be moved around in the DOM
   (moving a captured element would drop the capture). */
let drag = null;   // {id, el, ghost, x0, y0, started, del}
function editDown(ev, id){
  const board = $('.board');
  try{ board.setPointerCapture(ev.pointerId); }catch(e){}
  drag = {id, el:ev.currentTarget, x0:ev.clientX, y0:ev.clientY, started:false,
          del:!!(ev.target.closest && ev.target.closest('.t-del'))};
}
function groupDown(ev){
  if(!editMode) return;
  const box = ev.currentTarget.closest('.group');
  if(!box) return;
  try{ $('.board').setPointerCapture(ev.pointerId); }catch(e){}
  drag = {group:true, el:box, x0:ev.clientX, y0:ev.clientY, started:false};
}
function startDrag(){
  const el = drag.el, r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('placeholder');
  g.style.left = r.left+'px'; g.style.top = r.top+'px'; g.style.width = r.width+'px'; g.style.height = r.height+'px';
  document.body.appendChild(g);
  el.classList.add('placeholder');
  drag.ghost = g; drag.started = true;
  if(navigator.vibrate) navigator.vibrate(10);
}
function boardMove(ev){
  if(!drag) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.started){
    if(drag.del || Math.hypot(dx, dy) < 8) return;
    startDrag();
  }
  drag.ghost.style.transform = drag.group ? `translate(0,${dy}px)` : `translate(${dx}px,${dy}px) scale(1.08)`;
  // keep the board scrolling when dragging near the top or bottom of the screen
  if(ev.clientY < 80) window.scrollBy(0, -8);
  else if(ev.clientY > window.innerHeight - 100) window.scrollBy(0, 8);
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  if(!under) return;
  const el = drag.el;
  if(drag.group){   // groups stack vertically: slot above or below whichever box we're over
    const g = under.closest('.group');
    if(g && g !== el){
      const r = g.getBoundingClientRect();
      g.parentNode.insertBefore(el, ev.clientY < r.top + r.height/2 ? g : g.nextSibling);
    }
    return;
  }
  const t = under.closest('.tile');
  if(t && t !== el){
    const r = t.getBoundingClientRect();
    const before = ev.clientX < r.left + r.width/2;
    t.parentNode.insertBefore(el, before ? t : t.nextSibling);
    return;
  }
  const box = under.closest('.group');
  const c = under.closest('.tiles') || (box && box.querySelector('.tiles'));
  if(c && el !== c.lastElementChild) c.appendChild(el);
}
// read the new order (and group) straight from the DOM
function commitOrder(movedId){
  const order = [];
  document.querySelectorAll('.tiles[data-group]').forEach(c=>{
    const g = c.dataset.group === 'Other' ? '' : c.dataset.group;
    c.querySelectorAll('.tile[data-id]').forEach(t=>{
      const a = findAcc(t.dataset.id);
      if(!a || order.includes(a)) return;
      if(a.id === movedId) a.group = g;
      order.push(a);
    });
  });
  state.accs.forEach(a=>{ if(!order.includes(a)) order.push(a); });
  state.accs = order;
}
function boardUp(ev){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.started){
    d.ghost.remove(); d.el.classList.remove('placeholder');
    if(d.group) state.groupOrder = [...document.querySelectorAll('.group[data-group]')].map(g=>g.dataset.group);
    else commitOrder(d.id);
    save(); render();
    return;
  }
  if(d.group) return;
  if(d.del){ delAcc(d.id); return; }
  go('counter', d.id);
}
function boardCancel(){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.started){ d.ghost.remove(); render(); }
}

/* ---------- scrub: the screen is a slider ----------
   One number line across the screen: 0 in the middle, −range at the left edge,
   +range at the right edge, whichever side of the tile you started on.
   Range is SCRUB_STEPS steps, so ±50 for whole-number amounts, ±5 for tenths. */
const SCRUB_STEPS = 50;
const SCRUB_INSET = 32;   // px from each screen edge where the slider pins at 0 / full range
const LEVEL_PX = 12;      // measurements: relative drag, one step per this many px
let scrub = null;      // {id, sign, step, range, left, width, v, base, a, rel, x0}
// step size for scrubbing: whole numbers step by 1 (5 / 50 for big amounts),
// decimals step by their own precision
function scrubStep(amt){
  const n = Math.abs(amt);
  if(Number.isInteger(n)) return n >= 500 ? 50 : n >= 50 ? 5 : 1;
  const d = Math.min(2, (String(n).split('.')[1] || '').length);
  return Math.pow(10, -d);
}
function scrubBegin(id, side, x){
  const a = findAcc(id);
  if(!a) return;
  const x0 = pressInfo ? pressInfo.x : x;   // measure relative drags from the press point
  cancelPress();
  const step = scrubStep(addAmt(a));
  const r = $('#app').getBoundingClientRect();
  scrub = {id, step, range:step*SCRUB_STEPS,
           left:r.left + SCRUB_INSET, width:r.width - 2*SCRUB_INSET, v:0, base:tileValue(a), a,
           rel:isLevel(a), x0};
  const d = document.createElement('div');
  d.className = 'scrub'; d.id = 'scrub';
  document.body.appendChild(d);
  if(navigator.vibrate) navigator.vibrate(8);
  scrubUpdate(x);
}
function scrubUpdate(x){
  if(!scrub) return;
  const s = scrub;
  if(s.rel){   // measurement: value slides up/down from where it is now
    const n = Math.round((x - s.x0) / LEVEL_PX);
    s.v = Math.round((s.base + n*s.step) * 100) / 100;
    const el = $('#scrub');
    if(el) el.innerHTML = `
      <div class="scrub-val" style="color:${s.a.color}">${fmt(s.v)}</div>
      <div class="scrub-sub">${esc(s.a.name)} · was ${fmt(s.base)} · ${signed(s.v - s.base)} · release to set</div>`;
    return;
  }
  const half = s.width / 2, center = s.left + half;
  const f = Math.min(1, Math.max(-1, (x - center) / half));   // −1 … +1
  s.v = Math.round(Math.round(f * s.range / s.step) * s.step * 100) / 100;
  const v = s.v, a = s.a;
  const sign = v > 0 ? '+' : v < 0 ? '−' : '';
  const pct = (Math.abs(v) / s.range * 50).toFixed(1);   // fill grows out from the middle
  const el = $('#scrub');
  if(el) el.innerHTML = `
    <div class="scrub-val" style="color:${a.color}">${sign}${fmt(Math.abs(v))}</div>
    <div class="scrub-sub">${esc(a.name)} · ${fmt(s.base)} → ${fmt(s.base + v)} · release to apply</div>
    <div class="scrub-track"><div class="scrub-fill" style="margin-left:${v < 0 ? 50 - pct : 50}%; width:${pct}%; background:${a.color}"></div></div>`;
}
function scrubEnd(apply){
  if(!scrub) return;
  const s = scrub;
  scrub = null;
  const el = $('#scrub');
  if(el) el.remove();
  if(!apply) return;
  if(s.rel) setLevel(s.id, s.v);
  else addAmount(s.id, s.v);
}

/* timer buttons: tap = set timer, hold = edit that button */
function chipDown(ev, id, i){ pressDown(ev, 'chip-'+id+'-'+i, ()=>openTimerSheet(id, i)); }
function chipUp(ev, id, i){
  if(!pressUp('chip-'+id+'-'+i)) return;
  const p = homeTimers();
  if(i in p) setTimerTo(id, p[i]);
}

/* ---------- sheet ---------- */
function openSheet(html){
  closeSheet();
  const d = document.createElement('div');
  d.className = 'backdrop'; d.id = 'sheet';
  d.innerHTML = `<div class="sheet">${html}</div>`;
  const opened = Date.now();
  // ignore the click that trails the long press itself
  d.addEventListener('click', e=>{ if(e.target===d && Date.now()-opened>400) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet(){ const d = $('#sheet'); if(d) d.remove(); }

function openTimerSheet(id, i){
  const p = homeTimers();
  if(!(i in p)) return;
  openSheet(`
    <h3>Timer button</h3>
    <div><label>Time (m:ss or seconds)</label>
      <input type="text" id="sTime" value="${fmtTime(p[i])}" inputmode="numeric"
        onkeydown="if(event.key==='Enter')saveTimerSheet('${id}',${i})"></div>
    <div class="row"><button class="done tapbtn" onclick="saveTimerSheet('${id}',${i})">Done</button></div>`);
}
function saveTimerSheet(id, i){
  const s = parseTimeStr($('#sTime').value);
  if(!isFinite(s) || s<=0){ $('#sTime').focus(); return; }
  const p = homeTimers().slice(); p[i] = s; state.homeTimers = p;
  closeSheet(); save(); render();
  if(!tstate(id).running) setTimerTo(id, s);
}

/* ---------- counter page: stats + settings ---------- */
function counterView(id){
  const a = id ? findAcc(id) : null;
  if(id && !a){ view={name:'home'}; return homeView(); }
  const show = a ? a.show : 'today';
  const kind = a ? (a.kind||'tally') : (view.kind||'tally');
  const lvl = kind === 'level', rat = kind === 'ratio';
  const pickOpts = (cur)=> tallies().map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.name)}</option>`).join('');
  const sel = a ? a.color : COLORS[state.accs.length % COLORS.length];
  const sw = COLORS.map(c=>`
    <button class="swatch ${c===sel?'sel':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('');
  const stats = !a ? '' : rat ? `
    <div class="statrow" style="--acc:${a.color}">
      ${PERIODS.map(([p,l])=>`<div class="stat"><b>${fmtRatio(ratioValue(a,p))}</b><span>${l}</span></div>`).join('')}
    </div>` : lvl ? `
    <div class="statrow" style="--acc:${a.color}">
      ${LEVEL_STATS.map(([k,l])=>`<div class="stat"><b>${k==='change'?signed(levelStat(a,k)):fmt(levelStat(a,k))}</b><span>${l}</span></div>`).join('')}
    </div>` : `
    <div class="statrow" style="--acc:${a.color}">
      ${PERIODS.map(([p,l])=>`<div class="stat"><b>${fmt(periodValue(a,p))}</b><span>${l}</span></div>`).join('')}
    </div>`;
  return `
  <div class="d-top">
    <button class="back" onclick="go('home')">‹ ${a?'Back':'Cancel'}</button>
    <div class="d-title">${a?esc(a.name):'New counter'}</div>
    <span style="width:64px"></span>
  </div>
  ${stats}
  <div class="form">
    ${a ? '' : `
    <div><label>Type</label>
      <div class="seg">
        <button class="${kind==='tally'?'sel':''}" onclick="setNewKind('tally')">Tally</button>
        <button class="${lvl?'sel':''}" onclick="setNewKind('level')">Measurement</button>
        <button class="${rat?'sel':''}" onclick="setNewKind('ratio')">Ratio</button>
      </div>
      <div class="hint">${rat ? 'One tally divided by another over the same period, like miles ÷ hours for speed. Read-only.'
        : lvl ? 'A value you track over time, like body weight. Taps nudge it up or down.'
        : 'Things you count up over a day, week or month, like reps or miles.'}</div></div>`}
    <div><label>Name</label>
      <input type="text" id="fName" value="${a?esc(a.name):''}" placeholder="${rat?'Speed, Pace, Avg set…':lvl?'Weight, Resting HR, Sleep…':'Push-ups, Miles, Bets won…'}"></div>
    <div class="row">
      <div><label>Group</label>
        <input type="text" id="fGroup" list="groupList" value="${a?esc(a.group||''):''}" placeholder="Workout">
        <datalist id="groupList">
          ${[...new Set(state.accs.map(x=>(x.group||'').trim()).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}
        </datalist></div>
      ${rat ? '' : `<div><label>Unit</label>
        <input type="text" id="fUnit" list="unitList" value="${a?esc(a.unit||''):''}" placeholder="reps, mi, lb" oninput="unitHint()"></div>`}
    </div>
    <datalist id="unitList">
      ${UNITS.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}
      ${rat ? Object.keys(COMPOUND).map(c=>`<option value="${c}">`).join('') + '<option value="km/h"><option value="min/mi"><option value="min/km">' : ''}
    </datalist>
    ${rat ? '' : `<div id="unitHint" data-match="${a&&a.unitId?a.unitId:''}"></div>`}
    ${rat ? `
    <div class="row">
      <div><label>Divide</label><select id="fNum" onchange="ratioHint()">${pickOpts(a&&a.num)}</select></div>
      <div><label>by</label><select id="fDen" onchange="ratioHint()">${pickOpts(a&&a.den)}</select></div>
    </div>
    ${tallies().length < 2 ? `<div class="hint">You need two tally counters first.</div>` : ''}
    <div><label>Show as (unit)</label>
      <input type="text" id="fUnit" list="unitList" value="${a?esc(a.unit||''):''}" placeholder="mph, km/h, min/mi" oninput="ratioHint()">
      <div id="ratioHint" data-num="${a&&a.showNum?a.showNum:''}" data-den="${a&&a.showDen?a.showDen:''}" data-scale="${a&&isFinite(a.scale)?a.scale:1}"></div></div>` : ''}
    ${lvl ? `
    <div><label>${a?'Current value':'Starting value'}</label>
      <input type="number" step="any" id="fVal" value="${a?levelCurrent(a):''}" inputmode="decimal" placeholder="e.g. 180"></div>` : ''}
    ${rat ? '' : `
    <div>
      <div class="row">
        <div><label>${lvl?'Right side nudges up':'Tap adds'}</label>
          <input type="number" step="any" id="fTap" value="${a?a.tap:(lvl?0.5:1)}" inputmode="decimal"></div>
        <div><label>${lvl?'Left side nudges down':'Left side subtracts'}</label>
          <input type="number" step="any" min="0" id="fSub" value="${a?(isSplit(a)?a.sub:''):(lvl?0.5:1)}" inputmode="decimal" placeholder="off"></div>
      </div>
      <div class="hint">${lvl
        ? 'Tap the right of the tile to nudge up, the left to nudge down. Drag to slide the value.'
        : 'Right side of the tile adds, left third subtracts. Leave subtract blank for a whole-tile counter. Drag a tile to pick any amount.'}</div>
    </div>`}
    <div><label>Tile shows</label>
      <div class="seg" id="segShow" data-show="${lvl ? (a ? levelKey(a) : 'now') : show}">
        ${(lvl ? LEVEL_STATS : PERIODS).map(([p,l])=>`<button class="${(lvl ? (a ? levelKey(a) : 'now') : show)===p?'sel':''}" onclick="pickSeg(this,'show','${p}')">${l}</button>`).join('')}
      </div>
      <div class="hint">Flick a tile up or down on the main screen to switch this.</div></div>
    <div><label>Color</label><div class="swatches" data-color="${sel}">${sw}</div></div>
    <button class="save tapbtn" onclick="saveForm(${a?`'${a.id}'`:'null'})">${a?'Save':'Create counter'}</button>
    ${a?`<button class="danger" onclick="delAcc('${a.id}')">Delete this counter</button>`:''}
  </div>`;
}

/* ---------- form actions ---------- */
function setNewKind(k){ view.kind = k; render(); }
// tally / measurement: say what the typed unit matched, or offer a dropdown
function unitHint(){
  const box = $('#unitHint'), inp = $('#fUnit');
  if(!box || !inp) return;
  const sel = $('#fUnitMatch');
  if(sel) box.dataset.match = sel.value;   // remember the dropdown choice across re-renders
  const text = inp.value.trim(), m = matchUnit(text);
  if(!text){ box.innerHTML = ''; return; }
  if(m){ box.innerHTML = `<div class="hint ok">✓ ${m.name} (${DIM_NAME[m.dim]})</div>`; return; }
  box.innerHTML = `
    <div class="hint">Not a unit I know. Treat "${esc(text)}" as:</div>
    <select id="fUnitMatch" style="margin-top:6px" onchange="unitHint()">
      <option value="">just a label (no conversion)</option>
      ${unitOptions(box.dataset.match)}
    </select>`;
}
// ratio: show the conversion the typed unit implies, or offer dropdowns + manual factor
function ratioHint(){
  const box = $('#ratioHint');
  if(!box) return;
  const sn = $('#fShowNum'), sd = $('#fShowDen'), sc = $('#fScale');
  if(sn) box.dataset.num = sn.value;
  if(sd) box.dataset.den = sd.value;
  if(sc) box.dataset.scale = sc.value;
  const tmp = ratioFromForm();
  const parsed = parseCompound(tmp.unit);
  const c = ratioConv(tmp);
  if(parsed){ box.innerHTML = `<div class="hint ${isFinite(c.k)?'ok':'bad'}">${isFinite(c.k)?'✓ ':'✗ '}${c.msg}</div>`; return; }
  const n = findAcc(tmp.num), d = findAcc(tmp.den);
  const un = unitOf(n), ud = unitOf(d);
  box.innerHTML = `
    <div class="hint ${c.auto?(isFinite(c.k)?'ok':'bad'):''}">${c.auto?(isFinite(c.k)?'✓ ':'✗ '):''}${c.msg}</div>
    <div class="mini">
      <div><label>${n?esc(n.name):'Top'} shown in</label>
        <select id="fShowNum" onchange="ratioHint()"><option value="">${un?esc(un.name):'as is'}</option>${unitOptions(box.dataset.num, un&&un.dim)}</select></div>
      <div><label>${d?esc(d.name):'Bottom'} shown in</label>
        <select id="fShowDen" onchange="ratioHint()"><option value="">${ud?esc(ud.name):'as is'}</option>${unitOptions(box.dataset.den, ud&&ud.dim)}</select></div>
    </div>
    ${!(box.dataset.num || box.dataset.den) ? `
    <div class="mini"><div><label>or multiply by</label>
      <input type="number" step="any" id="fScale" value="${box.dataset.scale||1}" inputmode="decimal" oninput="ratioHint()"></div></div>` : ''}`;
}
// the ratio the form currently describes (used for live hints and saving)
function ratioFromForm(){
  const box = $('#ratioHint') || {dataset:{}};
  const parsed = parseCompound($('#fUnit').value);
  const scale = parseFloat(box.dataset.scale);
  return {kind:'ratio', num:$('#fNum').value, den:$('#fDen').value, unit:$('#fUnit').value.trim(),
          showNum: parsed ? '' : (box.dataset.num || ''), showDen: parsed ? '' : (box.dataset.den || ''),
          scale: (isFinite(scale) && scale !== 0) ? scale : 1};
}
function pickColor(el,c){
  el.parentElement.dataset.color = c;
  el.parentElement.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
function pickSeg(el,key,v){
  el.parentElement.dataset[key] = v;
  el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function parseTimeStr(s){
  s = s.trim();
  if(!s) return NaN;
  if(s.includes(':')){
    const parts = s.split(':');
    return (parseInt(parts[0])||0)*60 + (parseInt(parts[1])||0);
  }
  return Math.round(parseFloat(s));
}
function saveForm(id){
  const name = $('#fName').value.trim();
  if(!name){ $('#fName').focus(); return; }
  const unit = $('#fUnit').value.trim();
  const group = $('#fGroup').value.trim();
  const color = $('.swatches').dataset.color;
  const seg = $('#segShow');
  const show = seg ? (seg.dataset.show || 'today') : 'today';
  const kind = id ? (findAcc(id).kind||'tally') : (view.kind||'tally');
  const tapEl = $('#fTap'), subEl = $('#fSub');
  let tap = tapEl ? parseFloat(tapEl.value) : 1;
  if(!isFinite(tap) || tap===0) tap = 1;
  let sub = subEl ? Math.abs(parseFloat(subEl.value)) : 0;
  if(!isFinite(sub)) sub = 0;
  let ratio = null, unitId;
  if(kind==='ratio'){
    ratio = ratioFromForm();
    if(!ratio.num || !ratio.den || ratio.num===ratio.den){ $('#fDen').focus(); return; }
  }else{
    const m = matchUnit(unit), box = $('#unitHint');
    unitId = m ? m.id : ((box && box.dataset.match) || undefined);
  }
  const valEl = $('#fVal');
  const val = valEl ? parseFloat(valEl.value) : NaN;
  if(id){
    const a = findAcc(id);
    Object.assign(a,{name,unit,group,color,show,tap,sub,unitId});
    if(kind==='ratio') Object.assign(a,{num:ratio.num,den:ratio.den,unit:ratio.unit,showNum:ratio.showNum,showDen:ratio.showDen,scale:ratio.scale});
    if(kind==='level' && isFinite(val) && val !== levelCurrent(a)) setLevel(id, val);
  }else{
    const acc = {id:'a'+Date.now(),kind,name,unit,group,color,show,tap,sub,unitId,lifetime:0,byDay:{}};
    if(kind==='level') acc.byDay[dayKey()] = isFinite(val) ? Math.round(val*100)/100 : 0;
    if(kind==='ratio') Object.assign(acc,{num:ratio.num,den:ratio.den,showNum:ratio.showNum,showDen:ratio.showDen,scale:ratio.scale});
    state.accs.push(acc);
  }
  save(); go('home');
}
function delAcc(id){
  if(!confirm('Delete this counter and all its history?')) return;
  state.accs = state.accs.filter(a=>a.id!==id);
  if(lastAdd && lastAdd.accId===id) lastAdd = null;
  save();
  if(view.name==='home') render(); else go('home');
}
function go(name,id){
  closeSheet();
  editMode = false;
  view = {name, id};
  render();
  window.scrollTo(0,0);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();

// Offline support: register the service worker when running as a real site.
// (Skipped in preview sandboxes and file:// where it isn't available.)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
